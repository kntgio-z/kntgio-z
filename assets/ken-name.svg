<svg xmlns="http://www.w3.org/2000/svg"
     width="1000" height="260" viewBox="0 0 1000 260"
     role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="title">hi! I'm Ken</title>
  <desc id="desc">Monochrome terminal-style header: "hi! I'm" and the name Ken in ASCII art, above a square that jumps over scrolling spikes and blocks.</desc>

  <defs>
    <clipPath id="track-clip">
      <rect x="0" y="140" width="1000" height="92" />
    </clipPath>
    <path id="spike" d="M0 0 10-16 20 0Z" />
    <path id="double-spike" d="M0 0 8-16 16 0ZM14 0 23-16 32 0Z" />
    <rect id="block" x="0" y="-16" width="16" height="16" />
  </defs>

  <rect width="1000" height="260" fill="#000" />

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &quot;Liberation Mono&quot;, &quot;DejaVu Sans Mono&quot;, monospace" fill="#fff">
    <text x="364.0" y="34" font-size="16" fill="#8a8a8a">$ hi! I&#39;m</text>
    <rect x="453.4" y="22" width="9" height="15" fill="#fff">
      <animate attributeName="opacity" values="1;0" keyTimes="0;0.5" dur="1.2s" repeatCount="indefinite" calcMode="discrete" />
    </rect>
    <g font-size="28" font-weight="700">
      <text x="381.0 432.0 449.0" y="70">___</text>
      <text x="364.0 398.0 415.0 449.0 466.0 483.0 500.0 534.0 568.0 585.0" y="97">||//______</text>
      <text x="364.0 398.0 432.0 449.0 483.0 517.0 551.0 568.0 602.0" y="124">|&#39;//_\&#39;_\</text>
      <text x="364.0 398.0 432.0 483.0 500.0 517.0 551.0 585.0 619.0" y="151">|.\__/|||</text>
      <text x="364.0 381.0 398.0 415.0 432.0 449.0 466.0 483.0 500.0 517.0 534.0 551.0 585.0 602.0 619.0" y="178">|_|\_\___|_||_|</text>
    </g>
  </g>

  <g clip-path="url(#track-clip)" fill="#fff">
    <path d="M0 210.5H1000" stroke="#fff" stroke-width="1" opacity=".5" shape-rendering="crispEdges" />

    <!-- ground ticks and hazards scroll 600 px per 2 s; both patterns tile at 600 px, so the loop is seamless -->
    <g>
      <path d="M0 220H2000" stroke="#fff" stroke-width="2" stroke-dasharray="10 30" opacity=".22" fill="none" shape-rendering="crispEdges" />
      <use href="#spike" x="-280" y="210" />
      <use href="#block" x="-80" y="210" />
      <use href="#double-spike" x="120" y="210" />
      <use href="#spike" x="320" y="210" />
      <use href="#block" x="520" y="210" />
      <use href="#double-spike" x="720" y="210" />
      <use href="#spike" x="920" y="210" />
      <use href="#block" x="1120" y="210" />
      <use href="#double-spike" x="1320" y="210" />
      <use href="#spike" x="1520" y="210" />
      <use href="#block" x="1720" y="210" />
      <use href="#double-spike" x="1920" y="210" />
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-600 0" dur="2s" repeatCount="indefinite" />
    </g>

    <!-- player: x 222-238, three jumps per 2 s loop, each clears the hazard by 22 px or more -->
    <g transform="translate(230 210)">
      <animateTransform attributeName="transform" type="translate" additive="sum"
        dur="2s" repeatCount="indefinite" calcMode="linear"
        keyTimes="0;0.093333333;0.116666667;0.136666667;0.176666667;0.216666667;0.24;0.26;0.333333333;0.426666667;0.45;0.47;0.51;0.55;0.573333333;0.593333333;0.666666667;0.76;0.783333333;0.803333333;0.843333333;0.883333333;0.906666667;0.926666667;1"
        values="0 0;0 0;0 -24.08;0 -38.48;0 -50;0 -38.48;0 -21.12;0 0;0 0;0 0;0 -24.08;0 -38.48;0 -50;0 -38.48;0 -21.12;0 0;0 0;0 0;0 -24.08;0 -38.48;0 -50;0 -38.48;0 -21.12;0 0;0 0" />
      <rect x="-8" y="-16" width="16" height="16" />
      <rect x="2" y="-13" width="3" height="3" fill="#000" />
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
